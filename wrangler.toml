name = "igfxpro-api"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "02626740873f4636afd2e060f799a3ce"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[triggers]
# Four cadences, dispatched in worker.ts's scheduled handler by event.cron:
#   "* * * * *"    — fast tick: Binance (crypto, free/unlimited) + Finnhub
#                    (US equities, 60 calls/min free tier, ~35 symbols/tick)
#                    ONLY. Previously chained position-monitor onto the same
#                    invocation, which — combined with Prisma/DO-push
#                    overhead — was observed in production tripping
#                    Cloudflare's per-invocation CPU limit ("Exceeded CPU
#                    Limit" in wrangler tail), silently killing BOTH the
#                    quote refresh AND the SL/TP check together whenever it
#                    happened. Split out so each gets its own fresh CPU
#                    budget per Cloudflare Cron Trigger firing.
#   "*/2 * * * *"  — position-monitor (SL/TP, pending order triggers,
#                    per-user margin/stop-out check) on its own invocation.
#   "*/15 * * * *" — signal generator (5 candidate symbols, real RSI/MACD/
#                    EMA200 TA) + autopilot execution engine. 3 of the 5
#                    candidates use TwelveData candles (1 credit/call, same
#                    as a quote call — confirmed via api_usage) = 3 credits
#                    × 96 ticks/day = 288 credits/day, on the same rotating
#                    5-key pool as the slow tick below.
#   "0 * * * *"    — slow tick: TwelveData quotes for the ~80 remaining
#                    instruments (FOREX/METAL/COMMODITY/INDEX/EQUITY_EU),
#                    rotating across 5 API keys (twelvedata-rotation.ts) —
#                    5 × 800 = 4000 credits/day combined. 24 refreshes/day ×
#                    80 symbols = 1920 credits/day. Combined with the signal
#                    generator's 288/day, total ~2208/day — comfortably
#                    under the 4000 budget, leaving headroom for on-demand
#                    candle/chart requests on the same keys. Also refreshes
#                    the real economic calendar (FRED).
#                    (The original single-key */1 * * * * cadence across all
#                    130 symbols exhausted 162,986/800 daily credits on key 1.)
crons = ["* * * * *", "*/2 * * * *", "*/15 * * * *", "0 * * * *"]
