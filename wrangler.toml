name = "igfxpro-api"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "02626740873f4636afd2e060f799a3ce"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[triggers]
# Two providers, two cadences (src/modules/market-data/quotes.cron.ts):
#   "* * * * *" — fast tick: Binance (crypto, free/unlimited) + Finnhub
#                 (US equities, 60 calls/min free tier, ~35 symbols/tick) —
#                 both cheap enough to run every minute.
#   "0 * * * *" — slow tick: TwelveData for the ~80 remaining instruments
#                 (FOREX/METAL/COMMODITY/INDEX/EQUITY_EU), rotating across 5
#                 API keys (twelvedata-rotation.ts) — 5 × 800 = 4000
#                 credits/day combined budget. Hourly = 24 refreshes/day ×
#                 80 symbols = 1920 credits/day, using well under half the
#                 combined budget so on-demand candle/chart requests (same
#                 keys) and any future symbol growth have headroom.
#                 (The original single-key */1 * * * * cadence across all
#                 130 symbols exhausted 162,986/800 daily credits on key 1.)
# The scheduled handler in worker.ts checks event.cron to run the matching
# refresh function; position-monitor runs on every tick regardless.
crons = ["* * * * *", "0 * * * *"]
